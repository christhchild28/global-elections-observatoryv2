 #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;border-bottom:0;max-height:70vh;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(20,36,59,.28);transform:translateY(112%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}

.pn-bar{height:6px}

""><span class="dot"></span>Flávio Bolsonaro</td><td class="pol">Liberal Party (PL), right; senator and son of Jair Bolsonaro</td><td class="n">47.03%</td><td class="n">48.21%</td></tr></tbody></table></div><p class="note">Shares of valid votes. Third in the first round was Augusto Cury (Avante) with 2.89%.</p><h2 class="c">Who is being elected</h2><div class="ctx"><p>The president of Brazil, for a four-year term starting 5 January 2027. This page maps the runoff. The same general election also chose governors, the federal Congress and state legislatures, and that Congress is the other half of the story.</p><p>Lula, 80, takes a fourth non-consecutive term and has said it will be his last. His opponent was Senator Flávio Bolsonaro, whose father Jair Bolsonaro was president from 2019 to 2022.</p></div><h2 class="c">How the voting system works</h2><div class="ctx"><p class="oneline">A candidate needs more than half of valid votes. If nobody gets there, the top two go to a runoff three weeks later.</p><ol class="steps2"><li><b>Everyone votes, on screens</b>Voting is compulsory for citizens aged 18 to 70 and optional for 16 to 17 and over 70. Brazil votes on electronic machines and the TSE counts nationally, usually finishing within hours.</li><li><b>50% plus one of valid votes</b>Blank and spoiled ballots do not count. A first-round winner needs an absolute majority of the rest; in 2026 nobody got there.</li><li><b>The runoff is a straight choice</b>The top two candidates meet again on the last Sunday of October. Whoever has more votes wins, by any margin.</li><li><b>States are not electoral votes</b>There is no Electoral College. Every vote counts the same wherever it is cast, so São Paulo, Minas Gerais and Rio de Janeiro, with the most voters, matter most. That is why the Electorate map view looks so different from the land view.</li></ol></div><h2 class="c">What it means at home</h2><div class="ctx"><p>The margin was thin, about 4.4 million votes, and the reaction was not calm. Flávio Bolsonaro rejected the result and asked for it to be annulled. The TSE president said an extension of voting time had not affected the outcome, and legal experts questioned whether there were grounds to overturn it.</p><h4>A reversal of the first round</h4><p>The first round favoured Flávio Bolsonaro. Lula closed the gap in the runoff. His strongest states were in the north-east, as the Electorate map shows, and his campaign leaned on defending national sovereignty against US pressure.</p><h4>Governing is the next test</h4><p>Reporting expects resistance in the Senate to his judicial and institutional appointments. Winning the presidency does not by itself settle whether he has a working majority in Congress.</p></div><h2 class="c">What it means for the world</h2><div class="ctx"><h4>The tariff dispute</h4><p>Washington imposed a 50% tariff on many Brazilian exports in 2025, citing among other things Bolsonaro's prosecution and trade practices. Two further rounds of tariffs followed in July 2026. Lula campaigned on resisting them. After the win, the EU, Mexico, India, France, Canada and Russia congratulated him, while the United States was initially silent.</p><h4>Diversifying partners</h4><p>Brazil has answered US pressure by pushing the EU–Mercosur trade agreement and coordinating with BRICS partners, a strategy analysts describe as avoiding a choice between the US and China. A fourth Lula term means that approach continues.</p><h4>A region leaning right</h4><p>Trump-aligned governments have won elsewhere in Latin America, which could weaken Brazil's bargaining position with Washington. The Bolsonaro family has also campaigned in the US for the former president, and Flávio Bolsonaro reportedly headed to the United States after the vote.</p></div><h2 class="c">If it had gone the other way</h2><div class="ctx"><div class="panel other"><h3>A Flávio Bolsonaro presidency</h3><p>A Bolsonaro win would have been the first return of the family's movement to power after Jair Bolsonaro's 2022 defeat. The likeliest first effect abroad would have been a thaw with Washington, including pressure on the tariff dispute, and Brazil sitting closer to the region's Trump-aligned governments.</p><p>At home it would have reversed the direction of the social and environmental policy that Lula's coalition champions. With Lula re-elected, the EU–Mercosur and BRICS routes stay open.</p></div></div><div class="ctx"><p class="src"><b>Sources.</b> <a href="https://www.riotimesonline.com/brazil-elections-2026-results-data-room/">Rio Times: results data room (TSE figures)</a>. <a href="https://bernama.com/en/world/news.php?id=2625627">Bernama: Lula wins fourth term</a>. <a href="https://www.newsofbahrain.com/en/article/lula-wins-re-election-in-brazil-as-bolsonaro-rejects-run-off-result">News of Bahrain: Bolsonaro rejects result</a>. <a href="https://www.thequint.com/amp/story/opinion/what-lulas-record-fourth-term-victory-means-for-brazil-and-india">The Quint: what the win means</a>. <a href="https://www.giga-hamburg.de/publications/giga-focus/autonomy-and-its-limits-brazil-s-response-to-trump-s-threats">GIGA Focus: Brazil&#x27;s response to Trump</a>. <a href="https://kuwaittimes.com/article/47516/top-stories/brazils-lula-launches-fourth-term-bid-as-trump-looms-over-campaign/">Kuwait Times: tariffs and the campaign</a>. <a href="https://gulfnews.com/amp/story/world%2Famericas%2Fbrazilian-media-projects-lula-to-win-presidential-runoff-against-fl%C3%A1vio-bolsonaro-1.500723463">Gulf News: media projection</a>.</p></div><p class="foot">Summaries describe public positions and published projections, not forecasts. Last updated 10 November 2026.</p></template></div><div id="mapstart"></div><!--/v2-nav-->
