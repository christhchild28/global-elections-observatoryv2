 #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;border-bottom:0;max-height:70vh;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(20,36,59,.28);transform:translateY(112%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}

eds 270 of 538 electoral votes.</p><ol class="steps2"><li><b>Each state gets electors</b>A state has as many electoral votes as it has House seats plus two Senate seats. DC has three. That is the number of hexagons each state gets on this map.</li><li><b>Winner takes all, almost</b>In 48 states and DC, whoever wins the state's popular vote takes all its electoral votes. Maine and Nebraska split theirs by congressional district.</li><li><b>Small states count extra, swing states count most</b>Every state's two Senate-based electors make small states weigh more per person, and because most states are one-sided, campaigns concentrate on a handful of close ones.</li><li><b>The popular vote can disagree</b>It is possible to win more votes nationally and lose the Electoral College, as happened in 2000 and 2016. In 2024 the winner led both.</li></ol></div><h2 class="c">What it means at home</h2><div class="ctx"><p>Republican control of both chambers let the administration move quickly on tax, immigration and federal agencies for two years. Foreign aid was reshaped, with the administration moving to dissolve USAID and shift Food for Peace to the Agriculture Department.</p><h4>The correction came in 2026</h4><p>In the November 2026 midterms, voters concerned about affordability and perceived corruption gave Democrats control of both chambers. That makes the 2024 result the high-water mark of a unified government. See the midterms maps for the county-level detail.</p></div><h2 class="c">What it means for the world</h2><div class="ctx"><h4>Tariffs as the main tool</h4><p>Tariffs became the hallmark of Trump's foreign policy in his first year back, used to press countries on trade and on politics. A 50% rate on Brazilian goods in 2025 is the sharpest example.</p><h4>Allies, Ukraine and NATO</h4><p>The administration cut aid to Ukraine sharply, spoke of leaving NATO, and criticised many allies. Congress has already required a baseline of 76,000 US troops in Europe.</p><h4>Wars and the Western Hemisphere</h4><p>By 2026 the US was in a war with Iran and striking suspected drug boats off South America. On 3 January 2026 US forces struck Venezuela and captured its president, Nicolás Maduro.</p></div><h2 class="c">If it had gone the other way</h2><div class="ctx"><div class="panel other"><h3>A Harris presidency</h3><p>Republicans won both chambers in 2024, so a Harris administration would have faced a hostile Congress from day one and little room to pass its agenda. Its main power would have been executive action and appointments.</p><p>Abroad, Democratic priorities, as Foreign Policy summarised them after the midterms, include closer NATO ties, more support for Ukraine and restraint on boat strikes in Latin America. Tariffs would probably have been less central to foreign policy, though Democrats have also toughened their stance on China.</p></div></div><div class="ctx"><p class="src"><b>Sources.</b> <a href="https://www.cfr.org/articles/democrats-win-control-of-congress-heres-how-that-could-affect-u-s-foreign-policy">CFR: what a Democratic Congress can change</a>. <a href="https://globalaffairs.org/commentary/analysis/what-new-congress-could-mean-trumps-america-first-agenda">Chicago Council on Global Affairs: America First agenda</a>. <a href="https://www.giga-hamburg.de/publications/giga-focus/autonomy-and-its-limits-brazil-s-response-to-trump-s-threats">GIGA Focus: tariffs as the hallmark of foreign policy</a>. <a href="https://foreignpolicy.com/?p=1245336">Foreign Policy: World Brief</a>. <a href="https://www.pbs.org/newshour/world/us-strikes-venezuela-and-says-its-leader-maduro-has-been-captured-and-flown-out-of-the-country">PBS NewsHour/AP: US strikes Venezuela</a>. <a href="https://www.klgates.com/thought-leadership/2026-Midterm-Election-Guide-to-the-120th-Congress-11-4-2026">K&amp;L Gates: 2026 midterm guide</a>.</p></div><p class="foot">Results: official state returns as aggregated on this page. Policy summaries are high-level and describe public positions and reporting, not forecasts. Last updated 10 November 2026.</p></template></div><div id="mapstart"></div><!--/v2-nav-->
