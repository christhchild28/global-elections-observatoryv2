*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative;min-width:0}

.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dd-panel{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,36,59,.22);display:none;overflow:hidden}

.sorts{display:flex;gap:6px}
.sorts button{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:6px 11px;cursor:pointer;min-height:30px}

.dd-list{list-style:none;margin:0;padding:6px;max-height:min(52vh,380px);overflow:auto;overscroll-behavior:contain}
.dd-opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;min-height:44px}

.dd-opt.act{background:var(--soft);outline:2px solid var(--hi);outline-offset:-2px}
.dd-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt .mt{font:500 11.5px var(--mono);color:var(--mute)}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;position:relative}
svg *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.editing svg#map{touch-action:none}
.editing .pc{cursor:grab}.editing.dragging .pc{cursor:grabbing}
#mbox{position:fixed;display:none;z-index:50;pointer-events:none;border:1.5px dashed var(--ink);background:rgba(20,36,59,.10);border-radius:3px}
body.boxing{cursor:crosshair;-webkit-user-select:none;user-select:none}
.pc{cursor:pointer}
.ghost{fill:var(--ghost);stroke:var(--ghost);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}

.hov{fill:none;stroke:var(--ink);stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.geo-o{fill:none;stroke:#fff;stroke-width:.9px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hexe{stroke:#fff;stroke-width:1.3px;stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.hlh{fill:none;stroke:#fff;stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}

.glab,.slab{font:600 11px var(--mono);letter-spacing:.02em;pointer-events:none;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.36);stroke-width:.26em;stroke-linejoin:round}
.glab.dk,.slab.dk{fill:#14243b;stroke:rgba(255,255,255,.62)}

svg *:focus,svg *:focus-visible,svg:focus,svg:focus-visible{outline:none!important;box-shadow:none!important}
/* national strip */
.nat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:6px}

.nat-n{font-weight:600;display:inline-flex;align-items:center;gap:7px}

.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.note{color:var(--mute);font-size:12.5px;max-width:74ch;margin:0}
/* merged panel: side panel on desktop, bottom sheet on phones */
#sheet{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
@media(min-width:820px){#sheet{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;--gl:16px;--gr:16px}.pn-tgl{display:none!important}}

 #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;border-bottom:0;max-height:70vh;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(20,36,59,.28);transform:translateY(112%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
 #sheet.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}

}
.pn-bar{height:6px}
.pn-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px var(--gr) 8px var(--gl)}
.pn-n{font:600 20px/1.15 var(--display);display:block}
.pn-c{display:block;color:var(--mute);font:500 11px var(--mono);letter-spacing:.06em;margin-top:3px}

" data-p="3"/><circle class="s p4" cx="307.1" cy="173.1" r="3.15" data-p="4"/><circle class="s p4" cx="321.2" cy="172.9" r="3.15" data-p="4"/><circle class="s p4" cx="335.4" cy="173.1" r="3.15" data-p="4"/><circle class="s p4" cx="349.5" cy="173.0" r="3.15" data-p="4"/><circle class="s p4" cx="251.4" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="265.5" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="279.6" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="293.7" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="307.7" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="321.8" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="335.9" cy="186.0" r="3.15" data-p="4"/><circle class="s p4" cx="350.0" cy="186.0" r="3.15" data-p="4"/><line class="maj" x1="180.0" y1="128.2" x2="180.0" y2="2.4"/></svg><div class="center"><b id="cn">240</b><span id="cl">seats</span></div></div><p class="majlab">Dashed line: seat 121, where a majority begins</p><div class="legend" id="lg" role="group" aria-label="Filter seats by party"><button type="button" class="lg p0"><i></i>Progressive Bulgaria <b>131</b></button><button type="button" class="lg p1"><i></i>GERB–SDS <b>39</b></button><button type="button" class="lg p2"><i></i>PP–DB <b>37</b></button><button type="button" class="lg p3"><i></i>DPS <b>21</b></button><button type="button" class="lg p4"><i></i>Vazrazhdane <b>12</b></button></div><p class="note">Five forces cleared the 4% threshold. BSP – United Left, which sat in the outgoing governing coalition, fell out of Parliament. Seats are final CEC figures; turnout was about 51%.</p><div class="tw"><table><thead><tr><th class="">Party</th><th class="pol">Politics</th><th class="n">Vote</th><th class="n">Seats</th></tr></thead><tbody><tr class="p0"><td class=""><span class="dot"></span>Progressive Bulgaria</td><td class="pol">Former president Rumen Radev's new movement; centre-left, socially conservative</td><td class="n">44.6%</td><td class="n">131</td></tr><tr class="p1"><td class=""><span class="dot"></span>GERB–SDS</td><td class="pol">Centre-right, led by ex-PM Boyko Borisov</td><td class="n">13.4%</td><td class="n">39</td></tr><tr class="p2"><td class=""><span class="dot"></span>PP–DB</td><td class="pol">Pro-EU reform alliance</td><td class="n">12.6%</td><td class="n">37</td></tr><tr class="p3"><td class=""><span class="dot"></span>DPS</td><td class="pol">Movement for Rights and Freedoms; strong with Bulgaria's Turkish minority</td><td class="n">7.1%</td><td class="n">21</td></tr><tr class="p4"><td class=""><span class="dot"></span>Vazrazhdane</td><td class="pol">Nationalist, Eurosceptic</td><td class="n">4.3%</td><td class="n">12</td></tr></tbody></table></div><p class="note">Vote shares are of valid votes. Another 50,733 voters chose “I do not support anyone”.</p><h2 class="c">Who is being elected</h2><div class="ctx"><p>All 240 members of the National Assembly, Bulgaria's one-chamber parliament, for up to four years. The election was called early after the previous government, led by GERB with the Socialists, resigned in December 2025 following weeks of street protests over the 2026 budget and corruption.</p><p>Voters choose a party list, not a person. The Assembly then elects the prime minister. Former president Rumen Radev left the presidency to lead the list of Progressive Bulgaria, a three-party alliance.</p></div><h2 class="c">How the voting system works</h2><div class="ctx"><p class="oneline">Proportional representation with a 4% bar: a party's share of the vote becomes a near-equal share of seats, but only for parties above the line.</p><ol class="steps2"><li><b>Vote for a party list</b>Voters pick one party or coalition in their region. They can add a preference for one candidate on that list. The country is split into 31 multi-member districts; the map here shows the 28 provinces, with Sofia shown as one.</li><li><b>Parties under 4% get nothing</b>Votes for parties below the nationwide threshold are dropped, so the remaining parties' shares are scaled up. That is how a 44.6% share turned into 131 of 240 seats, 54.6%.</li><li><b>Seats are shared out by quota</b>Seats are allocated in proportion to votes using a quota-and-remainder method, then filled from each party's regional lists. Bulgarians abroad vote too.</li><li><b>The largest group goes first</b>The president hands the largest parliamentary group a mandate to form a government. Parliament elects it by a simple majority. Here one group holds that majority alone, which had not happened in recent Bulgarian history.</li></ol></div><h2 class="c">What it means at home</h2><div class="ctx"><p>The headline is stability. Seven elections in the previous five years had produced fragile coalitions and caretaker governments. A single group with 131 seats can pass a budget and legislation without bargaining, and Radev's government survived a confidence vote on 8 May.</p><h4>Cost of living comes first</h4><p>Bulgaria joined the euro in January 2026, and prices became the main grievance. The fall of the last government came after protests over a budget with higher taxes and social contributions. Radev criticised euro adoption but analysts do not expect him to reverse it.</p><h4>The open question: reform</h4><p>Voters rewarded Radev for change, but he has been vague on policy. Corruption and judicial reform, long conditions for EU funds, are where the new majority will be tested first.</p></div><h2 class="c">What it means for the world</h2><div class="ctx"><h4>Ukraine and Russia</h4><p>Radev condemned Russia's 2022 invasion but opposes military aid to Ukraine, has criticised EU sanctions, and objected to a 10-year defence pact Bulgaria signed with Kyiv in March. He has called for “practical relations with Russia”. Expect Sofia to stop short of vetoes but to sound more sceptical in EU talks.</p><h4>“Sound like Orbán, act like Fico”</h4><p>The European Council on Foreign Relations expects rhetoric closer to Hungary's Viktor Orbán but behaviour closer to Slovakia's Robert Fico. Bulgaria depends heavily on EU funds and is a NATO member, which limits how far it can drift. The new foreign minister has stressed a Euro-Atlantic orientation.</p><h4>Why Europe is watching</h4><p>EU decisions on sanctions, Ukraine financing and energy need unanimity or large majorities. One more hesitant government on the Black Sea flank adds friction, even without a veto.</p></div><h2 class="c">If it had gone the other way</h2><div class="ctx"><div class="panel other"><h3>A fragmented result, the ninth election in view</h3><p>Polls before the vote pointed to five or six forces and no clear winner. Without a majority, Bulgaria would probably have faced another round of coalition haggling among GERB, PP–DB and others, and a real chance of a ninth election.</p><p>That coalition would most likely have kept the traditional pro-EU line on Ukraine and sanctions, but it would have been weaker at home. The trade the voters made was stability and a more sceptical tone abroad in place of a steadier foreign-policy line and a weaker government.</p></div></div><div class="ctx"><p class="src"><b>Sources.</b> <a href="https://www.novinite.com/view_news.php?id=238183">Novinite: CEC final results, 24 April 2026</a>. <a href="https://en.wikipedia.org/wiki/2026_Bulgarian_parliamentary_election">Wikipedia: 2026 Bulgarian parliamentary election</a>. <a href="https://www.osw.waw.pl/en/publikacje/analyses/2026-05-08/radevs-government-bulgaria-status-quo-despite-hopes-change">OSW: Radev&#x27;s government</a>. <a href="https://ecfr.eu/article/bulgarias-election-and-what-it-means-for-europe/">ECFR: Bulgaria&#x27;s election and what it means for Europe</a>. <a href="https://www.atlanticcouncil.org/blogs/ukrainealert/bulgaria-is-unlikely-to-become-putins-new-proxy-within-the-european-union/">Atlantic Council</a>. <a href="https://www.aljazeera.com/amp/news/2026/4/20/bulgarias-former-president-radev-wins-election-all-you-need-to-know">Al Jazeera: all you need to know</a>. <a href="https://www.kyivpost.com/post/74330">Kyiv Post (Reuters)</a>.</p></div><p class="foot">Summaries describe public positions and published projections, not forecasts. Last updated 10 November 2026.</p></template></div><div id="mapstart"></div><!--/v2-nav-->
