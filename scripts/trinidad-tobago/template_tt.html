<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T&amp;T Seat Morph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#f6f4ef;--ink:#14243b;--mute:#5d6b7a;--card:#ffffff;--line:#d9d6cc;--unc:#e3b13a;--pnm:#c4454f;--tpp:#2a9d8f;--hi:#14243b;--soft:#efece4;--ghost:#e6e2d6;--ghost-line:#fbfaf6;--mid:#d9d4c6;
--display:'Fraunces',Georgia,serif;--body:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--ink:#eef1f4;--mute:#97a4b3;--card:#17232f;--line:#2a3846;--unc:#e8b94a;--pnm:#d4575f;--tpp:#35b0a1;--hi:#f2f5f8;--soft:#1d2b39;--ghost:#223244;--ghost-line:#3a4e63;--mid:#33475c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1824;--ink:#eef1f4;--mute:#97a4b3;--card:#17232f;--line:#2a3846;--unc:#e8b94a;--pnm:#d4575f;--tpp:#35b0a1;--hi:#f2f5f8;--soft:#1d2b39;--ghost:#223244;--ghost-line:#3a4e63;--mid:#33475c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:auto;display:grid;gap:14px}
h1{font:600 clamp(26px,7vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:6px 0 0;max-width:56ch}
.controls{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:620px){.controls{grid-template-columns:auto minmax(0,1fr);align-items:center}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative;min-width:0}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:9px;box-shadow:0 1px 3px rgba(20,36,59,.18);transition:transform .45s cubic-bezier(.65,0,.35,1)}
.seg[data-m="1"] i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;font:600 14px var(--body);color:var(--mute);background:none;border:0;padding:11px 18px;border-radius:9px;cursor:pointer;min-height:44px;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:focus-visible,.dd-btn:focus-visible,.dd-opt:focus-visible,.tog:focus-visible,.chip:focus-visible,.pn-b:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:50px;font:500 15px var(--body);color:var(--ink);cursor:pointer}
.dd-btn .lbl{color:var(--mute);font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.dd-btn .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dd-btn svg{width:16px;height:16px;flex:none;transition:transform .25s;color:var(--mute)}
.dd[data-open="1"] .dd-btn svg{transform:rotate(180deg)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dd-panel{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,36,59,.22);display:none;overflow:hidden}
.dd[data-open="1"] .dd-panel{display:block}
.dd-top{display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.dd-top input{width:100%;font:500 15px var(--body);padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.dd-top input:focus{outline:2px solid var(--hi);outline-offset:0}
.sorts{display:flex;gap:6px}
.sorts button{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:6px 11px;cursor:pointer;min-height:30px}
.sorts button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dd-list{list-style:none;margin:0;padding:6px;max-height:min(52vh,380px);overflow:auto;overscroll-behavior:contain}
.dd-opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;min-height:44px}
.dd-opt[aria-selected="true"]{background:var(--soft)}
.dd-opt.act{background:var(--soft);outline:2px solid var(--hi);outline-offset:-2px}
.dd-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt .mt{font:500 11.5px var(--mono);color:var(--mute)}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;position:relative}
svg *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.editing svg#map{touch-action:none}
.editing .pc{cursor:grab}.editing.dragging .pc{cursor:grabbing}
#mbox{position:fixed;display:none;z-index:50;pointer-events:none;border:1.5px dashed var(--ink);background:rgba(20,36,59,.10);border-radius:3px}
body.boxing{cursor:crosshair;-webkit-user-select:none;user-select:none}
.pc{cursor:pointer}
.ghost{fill:var(--ghost);stroke:var(--ghost);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.ghost-o{fill:none;stroke:var(--ghost-line);stroke-width:1.1px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.flip-o{fill:none;stroke:var(--ink);stroke-width:2.4px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:2px 8px 8px;font:500 11px var(--mono);color:var(--mute)}
.leg[hidden]{display:none}
.legbar{flex:0 1 150px;min-width:70px;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--pnm),var(--mid),var(--unc))}
.legf{flex-basis:100%}
.legf i{display:inline-block;width:14px;height:9px;border:2px solid var(--ink);border-radius:3px;vertical-align:-1px;margin-right:6px}
.sil{fill:var(--ghost);stroke:none;pointer-events:none}
.real-d{fill:none;stroke:var(--ink);stroke-width:1.3px;stroke-dasharray:5 4;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hov{fill:none;stroke:var(--ink);stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.geo-o{fill:none;stroke:#fff;stroke-width:.9px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hexe{stroke:#fff;stroke-width:1.3px;stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.hlh{fill:none;stroke:#fff;stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hl{fill:none;stroke:#000;stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.glab{font:600 1.7px var(--mono);letter-spacing:.02em;pointer-events:none;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.3);stroke-width:.5px;stroke-linejoin:round}
.slab{font:600 2.15px var(--mono);letter-spacing:.03em;pointer-events:none;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.3);stroke-width:.4px;stroke-linejoin:round}
.capbar{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;padding:2px 6px 4px;flex-wrap:wrap}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.tog{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;min-height:34px;white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tog[hidden]{display:none}
.cap{padding:6px 4px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cap b{color:var(--ink)}
svg *:focus,svg *:focus-visible,svg:focus,svg:focus-visible{outline:none!important;box-shadow:none!important}
/* national strip */
.nat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:6px}
.nat-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;min-width:0}
.nat-n{font-weight:600;display:inline-flex;align-items:center;gap:7px}
.nat-n small{color:var(--mute);font-weight:500;font-size:12px}
.nat-m{font:500 11.5px var(--mono);color:var(--mute)}
.nat-m b,.nat-s b{color:var(--ink)}
.nat-s{font:500 12px var(--mono);color:var(--mute)}
.nat-g{color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);padding-top:7px}
.nat-g b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.note{color:var(--mute);font-size:12.5px;max-width:74ch;margin:0}
/* merged panel: side panel on desktop, bottom sheet on phones */
#sheet{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
@media(min-width:820px){#sheet{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;--gl:16px;--gr:16px}.pn-tgl{display:none!important}}
@media(max-width:819px){
 #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;border-bottom:0;max-height:70vh;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(20,36,59,.28);transform:translateY(112%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
 #sheet.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
 #sheet:not(.full) .pn-more{display:none}
}
.pn-bar{height:6px}
.pn-hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 10px;padding:12px var(--gr) 8px var(--gl)}
.pn-n{font:600 20px/1.15 var(--display);display:block;overflow-wrap:anywhere}
.pn-c{display:block;color:var(--mute);font:500 11px var(--mono);letter-spacing:.06em;margin-top:3px}
.pn-r{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.pn-p{display:inline-block;padding:2px 9px;border-radius:99px;font:600 11.5px var(--body);white-space:nowrap;color:#fff}
.pn-b{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:0 11px;min-height:32px;cursor:pointer}
.pn-x{width:32px;padding:0;font:600 14px var(--body);background:var(--soft);border:0;border-radius:50%}
.pn-key{padding:2px var(--gr) 12px var(--gl);display:grid;gap:5px}
.bar{display:grid;grid-template-columns:62px 1fr 48px;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--mute);transition:color .3s,opacity .3s}
.bar.off{opacity:.55}.bar.on{color:var(--ink)}
.track{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;display:block}
.bar .v{text-align:right}
.pn-rel{margin-top:5px;color:var(--ink)}
.pn-rel b{font:600 20px var(--display)}
.pn-sw{font-size:13px;color:var(--mute);margin-top:2px}.pn-sw b{font-weight:600}
.up{color:#2f8f4e}.dn{color:#c0392b}
.pn-t .inc{color:var(--mute);font:500 9.5px var(--mono);margin-left:4px;letter-spacing:.04em}
.pn-flip{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:99px;background:var(--ink);color:var(--card);font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.pn-st{display:flex;flex-wrap:wrap;gap:4px 16px;padding:9px var(--gr) 9px var(--gl);background:color-mix(in srgb,var(--soft) 70%,transparent);border-block:1px solid var(--line);color:var(--mute);font-size:12px}
.pn-st b{color:var(--ink);font-weight:600}
.pn-t{width:calc(100% - var(--gl) - var(--gr));margin:8px var(--gr) 12px var(--gl);border-collapse:collapse;font-size:12.5px}
.pn-t th{font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 6px}
.pn-t td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
.pn-t .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pn-t th.num{text-align:right}
.pn-t tr.win td{background:color-mix(in srgb,var(--soft) 70%,transparent);font-weight:600}
.pn-t .nm{display:flex;gap:7px;align-items:baseline}
.pn-t .nm i{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(1px)}
.pn-chips{padding:10px var(--gr) 2px var(--gl);display:grid;gap:6px}
.pn-chl{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono);letter-spacing:.04em;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:0 11px;min-height:32px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pn-sum{font-size:12px;color:var(--mute)}.pn-sum b{color:var(--ink)}
.pn-empty{padding:16px var(--gr) 18px var(--gl)}
.pn-empty h2{font:600 20px/1.15 var(--display);margin:0 0 6px}
.pn-empty p{margin:0 0 8px;color:var(--mute)}
@media(max-width:619px){.nat-g{display:none}.nat{padding:9px 14px}.pn-rel b{font-size:17px}}
@media(max-width:420px){.pn-t{font-size:12px}.pn-t th,.pn-t td{padding-inline:4px}}

/* charts under the map */
.lc{display:grid;gap:14px;min-width:0}
.charts{display:grid;gap:14px;min-width:0}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.cc h3{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.cc .cs{color:var(--mute);font-size:12.5px;margin:0 0 12px;max-width:64ch}
.wh{margin:0 0 12px;font-size:15px;line-height:1.35}
.wh b{font-weight:600}
.wblk+.wblk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wt{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.wr{display:grid;gap:4px;margin-bottom:10px}.wr:last-child{margin-bottom:0}
.wl{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wb{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--soft);gap:1px}
.wb i{display:block;height:100%;transition:width .5s cubic-bezier(.65,0,.35,1)}
.wv{display:flex;justify-content:space-between;gap:8px;font:500 11.5px var(--mono);color:var(--mute);flex-wrap:wrap}
.wv b{color:var(--ink);font-weight:600}
.wv .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:0}
.sc svg{display:block;width:100%;height:auto;overflow:visible}
.sc .gl{stroke:var(--line);stroke-width:1}
.sc .ev{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.sc .fit{stroke:var(--ink);stroke-width:1.4;opacity:.55;fill:none}
.sc .tk{font:500 9.5px var(--mono);fill:var(--mute)}
.sc .ax{font:600 9px var(--mono);letter-spacing:.06em;fill:var(--mute);text-transform:uppercase}
.sc .dt{stroke:var(--card);stroke-width:.9;cursor:pointer;transition:opacity .2s}
.sc .dt.in{stroke:var(--hi);stroke-width:1.6}
.sc .dt.on{stroke:var(--hi);stroke-width:2.4}
.sc.has .dt:not(.in):not(.on){opacity:.55}
.sc .hit{fill:transparent;cursor:pointer}
.sc .lb{font:600 9.5px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:2.4px;stroke-linejoin:round;pointer-events:none}
.sc .nt{color:var(--mute);font-size:12.5px;margin:10px 0 0}
.sc .nt b{color:var(--ink);font-weight:600}
.rk-h{display:flex;justify-content:space-between;color:var(--mute);font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;gap:8px}
.rk-ax{position:relative;height:14px;margin-left:34px;color:var(--mute);font:500 9.5px var(--mono)}
.rk-ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rk{display:grid;gap:1px}
.rk-row{display:grid;grid-template-columns:34px 1fr;align-items:center;height:14px;padding:0;border:0;background:none;cursor:pointer;color:var(--mute);font:500 9px var(--mono);text-align:left}
.rk-row .tk{position:relative;height:100%;display:block}
.rk-row .tk::before{content:"";position:absolute;left:var(--c);top:0;bottom:0;width:1px;background:var(--line)}
.rk-row .br{position:absolute;top:2px;bottom:2px;border-radius:2px;opacity:.55;transition:opacity .2s}
.rk-row.in .br{opacity:.9}
.rk-row[aria-current="true"]{color:var(--ink);font-weight:600}
.rk-row[aria-current="true"] .br{opacity:1;top:0;bottom:0}
.rk-row .vl{position:absolute;top:50%;transform:translateY(-50%);font:600 10px var(--mono);color:var(--ink);white-space:nowrap;background:var(--card);padding:0 3px;border-radius:3px}
.rk-row:hover .br{opacity:.9}
.rk-row:focus-visible{outline:2px solid var(--hi);outline-offset:0}
@media(min-width:820px){.rk-row{height:13px}}
.scp{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.scp button{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.04em;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:0 11px;min-height:32px;cursor:pointer}
.scp button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.scp button:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.wv span{white-space:nowrap}
</style></head><body>
<div class="wrap">
<header><h1>Trinidad &amp; Tobago: land vs people</h1><p class="sub">The 2025 general election, seat by seat. Tap a seat to resize it from its land area to its population, or flip the whole map.</p></header>
<div class="controls">
 <div class="seg" id="seg" data-m="0" role="group" aria-label="Map view"><i></i><button id="bLand" aria-pressed="true">Land area</button><button id="bPop" aria-pressed="false">Population</button></div>
 <div class="dd" id="dd" data-open="0">
  <button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddList"><span class="lbl">Seat</span><span class="val" id="ddVal">All 41 seats</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg></button>
  <div class="dd-panel"><div class="dd-top"><input id="ddQ" type="search" placeholder="Search seats" autocomplete="off" aria-label="Search seats"><div class="sorts" id="sorts"><button data-s="n" aria-pressed="true">A–Z</button><button data-s="a" aria-pressed="false">Land</button><button data-s="p" aria-pressed="false">Electors</button></div></div>
  <ul class="dd-list" id="ddList" role="listbox" aria-label="Seats"></ul></div>
 </div>
</div>
<div class="nat" id="nat"></div>
<div class="grid">
 <div class="lc">

<script>
/*DATA*/
const S=GEO.S,W=Math.sqrt(3)*S,N=GEO.N;
const [bx0,by0,bx1,by1]=GEO.bounds,pad=S*2;
const vb=[bx0-pad,by0-pad,(bx1-bx0)+pad*2,(by1-by0)+pad*2];
const ang=k=>(90+60*k)*Math.PI/180;

const fmt=d3.format(',');
const PCOL={UNC:['var(--unc)','#14243b'],PNM:['var(--pnm)','#fff'],TPP:['var(--tpp)','#fff'],PF:['#8b2be2','#fff']};
const pcol=p=>PCOL[p]||['#6b7785','#fff'];
const pv=p=>'--'+p.toLowerCase();
const PARTIES=['UNC','PNM','TPP'];
const ST={};
Object.keys(GEO.area).forEach(k=>{const r=RES[k],u=r.c.find(c=>c.p==='UNC'),n=r.c.find(c=>c.p==='PNM');
 const prev=(u&&n&&u.d!=null&&n.d!=null)?((u.v-u.d)>(n.v-n.d)?'UNC':'PNM'):null;
 ST[k]={code:k,short:GEO.short[k],name:GEO.names[k],island:GEO.island[k],area:GEO.area[k],el:GEO.el[k],win:r.win,r,sw:r.sw,prev,flip:prev!=null&&prev!==r.win}});
const states=Object.values(ST),codes=Object.keys(ST);
const totArea=d3.sum(states,s=>s.area),totEl=d3.sum(states,s=>s.el);
states.forEach(s=>{s.aPct=s.area/totArea;s.pPct=s.el/totEl;s.nh=0});
const sgn=v=>v==null?'<span style="color:var(--mute)">—</span>':`<span class="${v>0?'up':v<0?'dn':''}">${v>0?'+':v<0?'−':''}${fmt(Math.abs(v))}</span>`;
const cells=GEO.cells;cells.forEach((c,i)=>{c.i=i;c.dx=0;c.dy=0;ST[c.st].nh++;c.g=[];for(let j=0;j<N;j++)c.g.push([c.gr[2*j],c.gr[2*j+1]])});
const home=cells.map(c=>[c.x,c.y]);
const kx0=cells[0].x,ky0=cells[0].y;
const key=(x,y)=>Math.round((x-kx0)/(W/2))+','+Math.round((y-ky0)/(1.5*S));
let idx=new Map();
function hexRing(cx,cy){const v=d3.range(6).map(k=>[cx+S*Math.cos(ang(k)),cy+S*Math.sin(ang(k))]);const per=N/6,out=[];
 for(let k=0;k<6;k++){const a=v[k],b=v[(k+1)%6];for(let j=0;j<per;j++){const u=j/per;out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}}
 return out.reverse()}
function reindex(){idx=new Map(cells.map(c=>[key(c.x,c.y),c]));cells.forEach(c=>{c.h=hexRing(c.x,c.y)})}
reindex();
// real centre of each state (mean of its land pieces) and offset that lets its hex cluster grow in place
const RC={},OFF={};
codes.forEach(k=>{const cs=cells.filter(c=>c.st===k);RC[k]=[d3.mean(cs,c=>d3.mean(c.g,p=>p[0])),d3.mean(cs,c=>d3.mean(c.g,p=>p[1]))];OFF[k]=[0,0]});
function calcOff(){codes.forEach(k=>{const cs=cells.filter(c=>c.st===k),mx=d3.mean(cs,c=>c.x),my=d3.mean(cs,c=>c.y);OFF[k]=[RC[k][0]-mx,RC[k][1]-my];
 const ds=cs.map(c=>Math.hypot(c.x-mx,c.y-my)),mxd=d3.max(ds)||1;cs.forEach((c,i)=>{c.dl=ds[i]/mxd})})}
calcOff();
const svg=d3.select('#map').attr('viewBox',vb.join(' '));
const svgN=svg.node();
const root=svg.append('g');
const colors={};
function readColors(){const cs=getComputedStyle(document.documentElement);['unc','pnm','tpp'].forEach(p=>colors[p.toUpperCase()]=d3.color(cs.getPropertyValue('--'+p).trim()||'#999'));colors.N=d3.color(cs.getPropertyValue('--mid').trim()||'#d9d4c6');
 states.forEach(s=>{if(s.sw==null){s.swc=colors.N;return}const u=Math.min(1,Math.abs(s.sw)/10);s.swc=d3.interpolateRgb(colors.N,colors[s.sw>0?'UNC':'PNM'])(.12+.88*u)})}
readColors();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readColors();render()});
const sstep=(a,b,t)=>{const u=Math.max(0,Math.min(1,(t-a)/(b-a)));return u*u*(3-2*u)};
// ---- layers (back to front) ----
const ghostP=root.append('path').attr('class','ghost').attr('d',GEO.ghost).attr('opacity',0);
const ghostO=root.append('g').attr('opacity',0);
ghostO.selectAll('path').data(codes).join('path').attr('class','ghost-o').attr('d',k=>GEO.outlines[k]);
const silL=root.append('g'),SIL={};codes.forEach(k=>{SIL[k]=silL.append('path').attr('class','sil').attr('d',GEO.outlines[k]).attr('opacity',0)});
const pieceG=root.append('g'),extraG=root.append('g');
const pieces=pieceG.selectAll('path').data(cells).join('path').attr('class','pc').attr('aria-label',c=>ST[c.st].name+', '+ST[c.st].win);
const extras=extraG.selectAll('path').data(GEO.extras).join('path').attr('class','pc').attr('d',d=>d.d);
const geoO=root.append('g');
const geoP=geoO.selectAll('path').data(states).join('path').attr('class','geo-o').attr('d',s=>GEO.outlines[s.code]);
const flipL=root.append('g'),FLP=states.filter(s=>s.flip).map(s=>({k:s.code,e:flipL.append('path').attr('class','flip-o').attr('d',GEO.outlines[s.code]).attr('opacity',0)}));
function chainD(segs,f){f=f==null?.3:f;const K=p=>Math.round(p[0]*40)+','+Math.round(p[1]*40),V=new Map(),E=[],seen=new Set();
 for(const s of segs){const a=K(s[0]),b=K(s[1]);if(a===b)continue;const ek=a<b?a+'|'+b:b+'|'+a;if(seen.has(ek))continue;seen.add(ek);const i=E.length;E.push([a,b,0]);
  for(const q of [[a,s[0]],[b,s[1]]]){let v=V.get(q[0]);if(!v){v={p:q[1],e:[]};V.set(q[0],v)}v.e.push(i)}}
 const other=(i,k)=>E[i][0]===k?E[i][1]:E[i][0];
 const walk=(start,closed)=>{const pts=[start];let cur=start;for(;;){const i=V.get(cur).e.find(j=>!E[j][2]);if(i===undefined)break;E[i][2]=1;cur=other(i,cur);pts.push(cur);if(closed?cur===start:V.get(cur).e.length!==2)break}return pts};
 const out=[];
 for(const [k,v] of V)if(v.e.length!==2)while(v.e.some(i=>!E[i][2]))out.push({pts:walk(k,false),closed:false});
 for(const [k,v] of V)while(v.e.some(i=>!E[i][2]))out.push({pts:walk(k,true),closed:true});
 const L=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u],F=q=>q[0].toFixed(2)+','+q[1].toFixed(2);let d='';
 for(const o of out){let P=o.pts.map(k=>V.get(k).p);
  if(o.closed){P.pop();const n=P.length;if(n<3)continue;
   for(let i=0;i<n;i++){const a=L(P[i],P[(i+n-1)%n],f),b=L(P[i],P[(i+1)%n],f);d+=(i?'L':'M')+F(a)+'Q'+F(P[i])+' '+F(b)}d+='Z'}
  else{d+='M'+F(P[0]);for(let i=1;i<P.length-1;i++){const a=L(P[i],P[i-1],f),b=L(P[i],P[i+1],f);d+='L'+F(a)+'Q'+F(P[i])+' '+F(b)}d+='L'+F(P[P.length-1])}}
 return d}
const nbrK=c=>d3.range(6).map(k=>{const th=ang(k)+Math.PI/6;return idx.get(key(c.x+W*Math.cos(th),c.y+W*Math.sin(th)))});
function segsOf(pred,o,cross){cells.forEach(c=>{if(!pred(c))return;nbrK(c).forEach((n,k)=>{if(n&&(cross?n.st!==c.st:pred(n)))return;const a=ang(k),b=ang(k+1);o.push([[c.x+S*Math.cos(a),c.y+S*Math.sin(a)],[c.x+S*Math.cos(b),c.y+S*Math.sin(b)]])})});return o}
const hexE=root.append('path').attr('class','hexe');
function drawEdges(){const segs=[];cells.forEach(c=>{nbrK(c).forEach((n,k)=>{if(n&&n.st!==c.st){const a=ang(k),b=ang(k+1);segs.push([[c.x+S*Math.cos(a),c.y+S*Math.sin(a)],[c.x+S*Math.cos(b),c.y+S*Math.sin(b)]])}})});hexE.attr('d',chainD(segs))}
const dashL=root.append('g'),DASH={};codes.forEach(k=>{DASH[k]=dashL.append('path').attr('class','real-d').attr('d',GEO.outlines[k]).attr('opacity',0)});
const hovP=root.append('path').attr('class','hov').attr('opacity',0);
const fgH=root.append('path').attr('class','hlh'),fgD=root.append('path').attr('class','hl');
const stG=root.append('g'),SG={};
codes.forEach(k=>{const g=stG.append('g');SG[k]={g,hH:g.append('path').attr('class','hlh').attr('opacity',0),hD:g.append('path').attr('class','hl').attr('opacity',0),lab:g.append('text').attr('class','slab').text(ST[k].short).attr('opacity',0).style('fill',ST[k].win==='UNC'?'#14243b':'#fff').style('stroke',ST[k].win==='UNC'?'rgba(255,255,255,.45)':'rgba(0,0,0,.3)')}});
const glabG=root.append('g'),GL={};
states.forEach(s=>{const p=GEO.labels[s.code];if(p[2]<1)return;const u=s.win==='UNC';GL[s.code]=glabG.append('text').attr('class','glab').attr('x',p[0]).attr('y',p[1]+.6).style('fill',u?'#14243b':'#fff').style('stroke',u?'rgba(227,177,58,.85)':'rgba(0,0,0,.25)').text(s.short)});
let showLab=true;
function drawLabels(){const seen=new Set(),best={};
 for(const c of cells){if(seen.has(c))continue;const comp=[c],st=[c];seen.add(c);while(st.length){const u=st.pop();for(const v of nbrK(u))if(v&&v.st===u.st&&!seen.has(v)){seen.add(v);comp.push(v);st.push(v)}}if(!best[c.st]||comp.length>best[c.st].length)best[c.st]=comp}
 for(const n in best){const a=best[n],mx=d3.mean(a,c=>c.x),my=d3.mean(a,c=>c.y);const c0=a.reduce((b,c)=>((c.x-mx)**2+(c.y-my)**2<(b.x-mx)**2+(b.y-my)**2?c:b),a[0]);
  SG[n].lab.attr('x',c0.x).attr('y',c0.y+.8)}}
function rebuildClusters(){codes.forEach(k=>{const d=chainD(segsOf(c=>c.st===k,[]));SG[k].hH.attr('d',d);SG[k].hD.attr('d',d)})}
// ---- state ----
const LD={};let CM=0,colorMode=0,T=0,target=0,cur=null,peek=null,DM=0,edit=false,drag=null,justDragged=false,hist=[];
const mor=new Set(),M={},twS={},twD={};codes.forEach(k=>{M[k]=0;twS[k]={}});
const te=k=>Math.max(T,M[k]);
const dimOf=k=>1-.75*DM*(1-te(k));
function render(){
 const vt=sstep(0,1,T);vbC=vb.map((v,i)=>v+(vbH[i]-v)*vt);svg.attr('viewBox',vbC.map(v=>v.toFixed(2)).join(' '));
 const w=1-T,FC={};codes.forEach(k=>{const wc=colors[ST[k].win];FC[k]=CM>.001?d3.color(d3.interpolateRgb(wc,ST[k].swc)(CM)):wc});
 const SP=.3,eo=x=>(1-Math.pow(2,-11*x))/(1-Math.pow(2,-11)),ez=(x,k)=>LD[k]?eo(x):1-eo(1-x);
 pieces.each(function(c){const k=c.st,tk=te(k),t=ez(Math.max(0,Math.min(1,tk*(1+SP)-c.dl*SP)),k),col=FC[k],o=OFF[k],ox=o[0]*w+c.dx*t,oy=o[1]*w+c.dy*t;let d='M';
  for(let j=0;j<N;j++){const g=c.g[j],h=c.h[j];d+=(j?'L':'')+(g[0]+(h[0]+ox-g[0])*t).toFixed(2)+','+(g[1]+(h[1]+oy-g[1])*t).toFixed(2)}
  const m=d3.interpolateRgb(col,d3.interpolateRgb(col,'#fff')(.3))(sstep(0,1,t));
  this.setAttribute('d',d+'Z');this.setAttribute('fill',col.formatRgb());this.setAttribute('stroke',m);this.setAttribute('stroke-width',t<.02?.6:.5);this.setAttribute('stroke-linejoin','round');this.style.vectorEffect='non-scaling-stroke';this.style.opacity=dimOf(k)});
 extras.attr('fill',d=>FC[d.st].formatRgb()).attr('opacity',d=>(1-sstep(0,.25,te(d.st)))*dimOf(d.st));
 geoP.attr('opacity',s=>(1-sstep(0,.3,te(s.code)))*dimOf(s.code));
 FLP.forEach(f=>f.e.attr('opacity',CM*(1-sstep(0,.3,te(f.k)))*dimOf(f.k)));
 ghostP.attr('opacity',vt);ghostO.attr('opacity',vt);hexE.attr('opacity',sstep(.7,1,T));
 codes.forEach(k=>{const t=te(k),dm=dimOf(k),loc=sstep(0,1,M[k])*(1-vt),o=OFF[k],G=SG[k];
  SIL[k].attr('opacity',loc*.85);DASH[k].attr('opacity',loc);
  G.g.attr('transform','translate('+(o[0]*w).toFixed(2)+','+(o[1]*w).toFixed(2)+')');
  const on=k===cur||mor.has(k),ol=Math.max(on?sstep(.5,1,t)*(k===cur?1:.6):0,ST[k].flip?CM*sstep(.5,1,t):0);G.hH.attr('opacity',ol);G.hD.attr('opacity',ol);
  G.lab.attr('opacity',showLab?sstep(.85,1,t)*dm:0);
  if(GL[k])GL[k].attr('opacity',showLab?(1-sstep(0,.25,t))*dm:0)});
 const fo=cur?1-sstep(0,.5,te(cur)):0;fgH.attr('opacity',fo);fgD.attr('opacity',fo)}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const tw={};
function go(m){target=m;codes.forEach(k=>{if(!mor.has(k))LD[k]=m});document.getElementById('seg').dataset.m=m;
 d3.select('#bLand').attr('aria-pressed',m===0);d3.select('#bPop').attr('aria-pressed',m===1);
 d3.select(tw).interrupt().transition().duration(reduce?150:420).ease(d3.easeLinear).tween('t',()=>{const i=d3.interpolateNumber(T,m);return u=>{T=i(u);render()}});
 if(m===0&&edit)setEdit(false);
 drawCap();drawPanel();syncBtns()}
d3.select('#tLab').on('click',function(){showLab=!showLab;this.setAttribute('aria-pressed',showLab);render()});

function drawCap(){document.getElementById('cap').innerHTML=edit?'Drag a hex to swap or move it. Select a seat first to drag the whole cluster':target?'Sized by <b>population</b> · one hexagon ≈ equal share':mor.size?`<b>${mor.size}</b> resized to population · tap to revert`:'Real boundaries · tap a seat to resize it'}
// ---- numbers ----
const pct=v=>v>=.1?Math.round(v*100)+'%':(v*100).toFixed(1)+'%';
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function barHTML(lbl,v,col,on){return `<div class="bar ${on?'on':'off'}"><span>${lbl}</span><span class="track"><span class="fill" style="width:${(v*100).toFixed(1)}%;background:${col}"></span></span><span class="v">${pct(v)}</span></div>`}
// national strip

const sheet=document.getElementById('sheet'),pnBody=document.getElementById('pnBody');

 return `<div class="pn-chips"><div class="pn-chl">${ss.map(s=>`<button class="chip${s.code===cur?' on':''}" data-k="${s.code}"><i class="dot" style="background:var(${pv(s.win)})"></i>${escH(s.short)}</button>`).join('')}</div><div class="pn-sum"><b>${ss.length} resized</b> hold ${pct(la)} of the land and ${pct(pa)} of electors</div></div>`}
function panelHTML(k){const s=ST[k],r=s.r,pc=pcol(s.win),dens=s.el/s.area,rel=dens/(totEl/totArea),res=mor.has(k)||target===1;

 const tw=s.sw==null?null:s.sw>0?'UNC':'PNM';

 return `<div class="pn-bar" style="background:${pc[0]}"></div>

 <div class="pn-key">${barHTML('Land',s.aPct,`var(${pv(s.win)})`,!res)}${barHTML('Electors',s.pPct,`var(${pv(s.win)})`,res)}<div class="pn-rel">${rtxt}</div>${swH}</div>
 <div class="pn-more"><div class="pn-st"><span>Electorate <b>${fmt(r.e)}</b></span><span>Turnout <b>${r.t.toFixed(1)}%</b></span><span>Rejected <b>${fmt(r.rj)}</b></span><span>Margin <b>${r.m.toFixed(1)}%</b></span><span>Area <b>${fmt(Math.round(s.area))} km²</b></span><span>Hexes <b>${s.nh}</b></span></div>

const emptyHTML=`<div class="pn-empty"><h2>Tap a seat</h2><p>It resizes to its share of the population while a dashed line keeps its real shape. Tap again to revert, or tap several to compare.</p><p>On a computer, hover to preview any seat.</p></div>`;
const mqPhone=matchMedia('(max-width:819px)');

 const dots=ord.map(s=>`<circle class="dt" data-k="${s.code}" cx="${sxs(lx(s)).toFixed(1)}" cy="${sys(shr(s)).toFixed(1)}" r="${sr(s).toFixed(1)}" style="fill:var(${PK[s.win].v})"><title>${escH(s.name)}: ${shr(s).toFixed(1)}% ${PK[scP].s}, ${fmt(Math.round(s.el/s.area))} electors per km²</title></circle>`).join('');
 const hits=ord.map(s=>`<circle class="hit" data-k="${s.code}" cx="${sxs(lx(s)).toFixed(1)}" cy="${sys(shr(s)).toFixed(1)}" r="${Math.max(sr(s),7).toFixed(1)}"/>`).join('');
 const rtxt=Math.abs(fit.r)<.2?`Density says little about ${PK[scP].s} support`:fit.r>0?`Denser seats give <b>${PK[scP].s}</b> more of the vote`:`Denser seats give <b>${PK[scP].s}</b> less of the vote`;
 el.innerHTML=`<h3>Density vs the vote</h3><p class="cs">Each dot is a seat, coloured by its winner. Pick a party for the vertical axis.</p>
 <div class="scp" role="group" aria-label="Party on the vertical axis">${['UNC','PNM'].map(k=>`<button data-p="${k}" aria-pressed="${k===scP}"><i class="dot" style="background:var(${PK[k].v})"></i>${PK[k].s}</button>`).join('')}</div>
 <svg viewBox="0 0 ${SCW} ${SCH}" role="img" aria-label="Scatter of electors per square kilometre against ${PK[scP].n} share of the vote, by seat">${g}
 <line class="fit" x1="${sxs(xa)}" y1="${sys(fa)}" x2="${sxs(xb)}" y2="${sys(fb)}"/>${dots}<g id="scLb"></g>${hits}
 <text class="ax" x="${(SCl+SCW-SCr)/2}" y="${SCH-4}" text-anchor="middle">Electors per km² · log scale</text>
 <text class="ax" transform="translate(9 ${(SCt+SCH-SCb)/2}) rotate(-90)" text-anchor="middle">${PK[scP].s} % of votes</text></svg>
 <p class="nt">${rtxt} (<b>r = ${fit.r>=0?'':'−'}${Math.abs(fit.r).toFixed(2)}</b>, weighted by votes; line shows the fit). This compares seats, not individual voters.</p>`;
 const svgS=el.querySelector('svg');
 svgS.addEventListener('click',e=>{const h=e.target.closest('[data-k]');if(h)setFocus(h.dataset.k)});
 svgS.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const h=e.target.closest('[data-k]');if(h)peekSet(h.dataset.k)});
 svgS.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&e.target.closest('[data-k]'))peekSet(null)});

function scSet(k){if(k!=='UNC'&&k!=='PNM'||k===scP)return;scP=k;drawScSkeleton();drawScSel()}
function drawScSel(){const el=document.getElementById('cSc');const sel=selStates();el.classList.toggle('has',sel.length>0);
 el.querySelectorAll('.dt').forEach(c=>{const k=c.dataset.k;c.classList.toggle('on',k===cur);c.classList.toggle('in',mor.has(k)&&k!==cur)});
 const lb=el.querySelector('#scLb');if(lb)lb.innerHTML=labelSet().map(l=>`<text class="lb" x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" text-anchor="${l.an}">${lab(ST[l.k])}</text>`).join('')}
// ranked: share of electors / share of land
const RK=LAND.slice().sort((a,b)=>b.pPct/b.aPct-a.pPct/a.aPct);
const rkLg=RK.map(s=>Math.log2(s.pPct/s.aPct)),rkLO=Math.floor(d3.min(rkLg)-.6),rkHI=Math.ceil(d3.max(rkLg)+.6),rkSP=rkHI-rkLO,rkCP=-rkLO/rkSP*100,rkPos=v=>(Math.log2(v)-rkLO)/rkSP*100;
function drawRkSkeleton(){const el=document.getElementById('cRk');
 const tk=[[.1,'0.1×'],[.25,'¼×'],[.5,'½×'],[1,'1×'],[2,'2×'],[4,'4×'],[10,'10×']].filter(([v])=>(rkPos(v)>4&&rkPos(v)<96)||v===1);
 el.innerHTML=`<h3>All 41 seats, ranked</h3><p class="cs">A seat's share of electors divided by its share of land. Bars right of the line gain size when resized; bars left shrink.</p>
 <div class="rk-h"><span>◀ shrinks</span><span>grows ▶</span></div><div class="rk-ax" id="rkAx">${tk.map(([v,l])=>`<span style="left:${rkPos(v)}%">${l}</span>`).join('')}</div>
 <div class="rk" id="rk" style="--c:${rkCP}%">${RK.map(s=>{const r=s.pPct/s.aPct,lg=Math.log2(r),w=Math.abs(lg)/rkSP*100,l=lg>=0?rkCP:rkCP-w;
  return `<button class="rk-row" data-k="${s.code}" aria-label="${escH(s.name)}, ${rkTxt(r)} when resized to its electors"><span>${lab(s)}</span><span class="tk" style="--c:${rkCP}%"><i class="br" style="left:${l}%;width:${Math.max(w,.5)}%;background:var(${PK[s.win].v})"></i><span class="vl"></span></span></button>`}).join('')}</div>`;
 const rk=el.querySelector('#rk');
 rk.addEventListener('click',e=>{const b=e.target.closest('.rk-row');if(b)setFocus(b.dataset.k)});
 rk.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest('.rk-row');if(b)peekSet(b.dataset.k)});
 rk.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')peekSet(null)})}
function drawRkSel(){const rows=document.getElementById('rk').children;
 RK.forEach((s,i)=>{const r=rows[i],on=s.code===cur;r.setAttribute('aria-current',on);r.classList.toggle('in',mor.has(s.code)&&!on);const v=r.querySelector('.vl');
  if(on){const q=s.pPct/s.aPct,lg=Math.log2(q),w=Math.abs(lg)/rkSP*100;v.textContent='#'+(i+1)+' · '+rkTxt(q);v.style.left=v.style.right='';
   if(lg>=0&&rkCP+w>58){v.style.right=(100-(rkCP-1))+'%';v.style.left='auto'}else if(lg>=0){v.style.left=(rkCP+w+1.5)+'%';v.style.right='auto'}else if(rkCP-w>40){v.style.right=(100-(rkCP-w-1.5))+'%';v.style.left='auto'}else{v.style.left=(rkCP+1.5)+'%';v.style.right='auto'}}
  else v.textContent=''})}
function drawCharts(){drawWho();drawScSel();drawRkSel()}
drawScSkeleton();drawRkSkeleton();
