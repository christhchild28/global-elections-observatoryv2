<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulgaria District Morph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#f6f4ef;--ink:#14243b;--mute:#5d6b7a;--card:#ffffff;--line:#d9d6cc;--pb:#c8323c;--gerb:#2f6fb5;--ppdb:#e0a010;--dps:#7b4fa6;--vaz:#8a6a45;--oth:#8a929c;--hi:#14243b;--soft:#efece4;--ghost:#e6e2d6;--ghost-line:#fbfaf6;--mid:#d9d4c6;
--display:'Fraunces',Georgia,serif;--body:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--ink:#eef1f4;--mute:#97a4b3;--card:#17232f;--line:#2a3846;--pb:#e0545c;--gerb:#4a8de0;--ppdb:#eeb52a;--dps:#9b72c9;--vaz:#b08a5f;--oth:#9aa4ae;--hi:#f2f5f8;--soft:#1d2b39;--ghost:#223244;--ghost-line:#3a4e63;--mid:#33475c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1824;--ink:#eef1f4;--mute:#97a4b3;--card:#17232f;--line:#2a3846;--pb:#e0545c;--gerb:#4a8de0;--ppdb:#eeb52a;--dps:#9b72c9;--vaz:#b08a5f;--oth:#9aa4ae;--hi:#f2f5f8;--soft:#1d2b39;--ghost:#223244;--ghost-line:#3a4e63;--mid:#33475c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);margin:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:auto;display:grid;gap:14px}
h1{font:600 clamp(26px,7vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:6px 0 0;max-width:56ch}
.controls{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:620px){.controls{grid-template-columns:auto minmax(0,1fr);align-items:center}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative;min-width:0}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:9px;box-shadow:0 1px 3px rgba(20,36,59,.18);transition:transform .45s cubic-bezier(.65,0,.35,1)}
.seg[data-m="1"] i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;font:600 14px var(--body);color:var(--mute);background:none;border:0;padding:11px 18px;border-radius:9px;cursor:pointer;min-height:44px;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:focus-visible,.dd-btn:focus-visible,.dd-opt:focus-visible,.tog:focus-visible,.chip:focus-visible,.pn-b:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.dd{position:relative;min-width:0}
.dd-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:50px;font:500 15px var(--body);color:var(--ink);cursor:pointer}
.dd-btn .lbl{color:var(--mute);font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.dd-btn .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dd-btn svg{width:16px;height:16px;flex:none;transition:transform .25s;color:var(--mute)}
.dd[data-open="1"] .dd-btn svg{transform:rotate(180deg)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dd-panel{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,36,59,.22);display:none;overflow:hidden}
.dd[data-open="1"] .dd-panel{display:block}
.dd-top{display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.dd-top input{width:100%;font:500 15px var(--body);padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:42px}
.dd-top input:focus{outline:2px solid var(--hi);outline-offset:0}
.sorts{display:flex;gap:6px}
.sorts button{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:6px 11px;cursor:pointer;min-height:30px}
.sorts button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.dd-list{list-style:none;margin:0;padding:6px;max-height:min(52vh,380px);overflow:auto;overscroll-behavior:contain}
.dd-opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;cursor:pointer;min-height:44px}
.dd-opt[aria-selected="true"]{background:var(--soft)}
.dd-opt.act{background:var(--soft);outline:2px solid var(--hi);outline-offset:-2px}
.dd-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt .mt{font:500 11.5px var(--mono);color:var(--mute)}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;position:relative}
svg *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.editing svg#map{touch-action:none}
.editing .pc{cursor:grab}.editing.dragging .pc{cursor:grabbing}
#mbox{position:fixed;display:none;z-index:50;pointer-events:none;border:1.5px dashed var(--ink);background:rgba(20,36,59,.10);border-radius:3px}
body.boxing{cursor:crosshair;-webkit-user-select:none;user-select:none}
.pc{cursor:pointer}
.ghost{fill:var(--ghost);stroke:var(--ghost);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.ghost-o{fill:none;stroke:var(--ghost-line);stroke-width:1.1px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:2px 8px 8px;font:500 11px var(--mono);color:var(--mute)}
.leg[hidden]{display:none}
.legbar{flex:0 1 150px;min-width:70px;height:9px;border-radius:5px;display:inline-block}
.leg .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sil{fill:var(--ghost);stroke:none;pointer-events:none}
.real-d{fill:none;stroke:var(--ink);stroke-width:1.3px;stroke-dasharray:5 4;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hov{fill:none;stroke:var(--ink);stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.geo-o{fill:none;stroke:#fff;stroke-width:.9px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hexe{stroke:#fff;stroke-width:1.3px;stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.hlh{fill:none;stroke:#fff;stroke-width:4px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.hl{fill:none;stroke:#000;stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.glab,.slab{font:600 11px var(--mono);letter-spacing:.02em;pointer-events:none;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.36);stroke-width:.26em;stroke-linejoin:round}
.glab.dk,.slab.dk{fill:#14243b;stroke:rgba(255,255,255,.62)}
.capbar{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;padding:2px 6px 4px;flex-wrap:wrap}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.tog{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;min-height:34px;white-space:nowrap}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tog[hidden]{display:none}
select.tog{text-transform:none;letter-spacing:.02em;padding:6px 8px 6px 12px;max-width:100%;font-weight:600}
.cap{padding:6px 4px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cap b{color:var(--ink)}
svg *:focus,svg *:focus-visible,svg:focus,svg:focus-visible{outline:none!important;box-shadow:none!important}
/* national strip */
.nat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:6px}
.nat-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;min-width:0}
.nat-n{font-weight:600;display:inline-flex;align-items:center;gap:7px}
.nat-n small{color:var(--mute);font-weight:500;font-size:12px}
.nat-m{font:500 11.5px var(--mono);color:var(--mute)}
.nat-m b,.nat-s b{color:var(--ink)}
.nat-s{font:500 12px var(--mono);color:var(--mute)}
.nat-g{color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);padding-top:7px}
.nat-g b{color:var(--ink);font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.note{color:var(--mute);font-size:12.5px;max-width:74ch;margin:0}
/* merged panel: side panel on desktop, bottom sheet on phones */
#sheet{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
@media(min-width:820px){#sheet{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;--gl:16px;--gr:16px}.pn-tgl{display:none!important}}
@media(max-width:819px){
 #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;border-bottom:0;max-height:70vh;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(20,36,59,.28);transform:translateY(112%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
 #sheet.open{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s}
 #sheet:not(.full) .pn-more{display:none}
}
.pn-bar{height:6px}
.pn-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px var(--gr) 8px var(--gl)}
.pn-n{font:600 20px/1.15 var(--display);display:block}
.pn-c{display:block;color:var(--mute);font:500 11px var(--mono);letter-spacing:.06em;margin-top:3px}
.pn-r{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.pn-p{display:inline-block;padding:2px 9px;border-radius:99px;font:600 11.5px var(--body);white-space:nowrap;color:#fff}
.pn-b{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:0 11px;min-height:32px;cursor:pointer}
.pn-x{width:32px;padding:0;font:600 14px var(--body);background:var(--soft);border:0;border-radius:50%}
.pn-key{padding:2px var(--gr) 12px var(--gl);display:grid;gap:5px}
.bar{display:grid;grid-template-columns:62px 1fr 48px;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--mute);transition:color .3s,opacity .3s}
.bar.off{opacity:.55}.bar.on{color:var(--ink)}
.track{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;display:block}
.bar .v{text-align:right}
.pn-rel{margin-top:5px;color:var(--ink)}
.pn-rel b{font:600 20px var(--display)}
.pn-sw{font-size:13px;color:var(--mute);margin-top:2px}.pn-sw b{font-weight:600}
.pn-st{display:flex;flex-wrap:wrap;gap:4px 16px;padding:9px var(--gr) 9px var(--gl);background:color-mix(in srgb,var(--soft) 70%,transparent);border-block:1px solid var(--line);color:var(--mute);font-size:12px}
.pn-st b{color:var(--ink);font-weight:600}
.pn-t{width:calc(100% - var(--gl) - var(--gr));margin:8px var(--gr) 12px var(--gl);border-collapse:collapse;font-size:12.5px}
.pn-t th{font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 6px}
.pn-t td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
.pn-t .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pn-t th.num{text-align:right}
.pn-t tr.win td{background:color-mix(in srgb,var(--soft) 70%,transparent);font-weight:600}
.pn-t .nm{display:flex;gap:7px;align-items:baseline}
.pn-t .nm i{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(1px)}
.pn-chips{padding:10px var(--gr) 2px var(--gl);display:grid;gap:6px}
.pn-chl{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--mono);letter-spacing:.04em;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:0 11px;min-height:32px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pn-sum{font-size:12px;color:var(--mute)}.pn-sum b{color:var(--ink)}
.pn-empty{padding:16px var(--gr) 18px var(--gl)}
.pn-empty h2{font:600 20px/1.15 var(--display);margin:0 0 6px}
.pn-empty p{margin:0 0 8px;color:var(--mute)}
@media(max-width:619px){.nat-g{display:none}.nat{padding:9px 14px}.pn-rel b{font-size:17px}}
@media(max-width:420px){.pn-t{font-size:12px}.pn-t th,.pn-t td{padding-inline:4px}}

/* charts under the map */
.lc{display:grid;gap:14px;min-width:0}
.charts{display:grid;gap:14px;min-width:0}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.cc h3{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.cc .cs{color:var(--mute);font-size:12.5px;margin:0 0 12px;max-width:64ch}
.wh{margin:0 0 12px;font-size:15px;line-height:1.35}
.wh b{font-weight:600}
.wblk+.wblk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wt{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.wr{display:grid;gap:4px;margin-bottom:10px}.wr:last-child{margin-bottom:0}
.wl{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wb{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--soft);gap:1px}
.wb i{display:block;height:100%;transition:width .5s cubic-bezier(.65,0,.35,1)}
.wv{display:flex;justify-content:space-between;gap:8px;font:500 11.5px var(--mono);color:var(--mute);flex-wrap:wrap}
.wv b{color:var(--ink);font-weight:600}
.wv .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:0}
.sc svg{display:block;width:100%;height:auto;overflow:visible}
.sc .gl{stroke:var(--line);stroke-width:1}
.sc .ev{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.sc .fit{stroke:var(--ink);stroke-width:1.4;opacity:.55;fill:none}
.sc .tk{font:500 9.5px var(--mono);fill:var(--mute)}
.sc .ax{font:600 9px var(--mono);letter-spacing:.06em;fill:var(--mute);text-transform:uppercase}
.sc .dt{stroke:var(--card);stroke-width:.9;cursor:pointer;transition:opacity .2s}
.sc .dt.in{stroke:var(--hi);stroke-width:1.6}
.sc .dt.on{stroke:var(--hi);stroke-width:2.4}
.sc.has .dt:not(.in):not(.on){opacity:.55}
.sc .hit{fill:transparent;cursor:pointer}
.sc .lb{font:600 9.5px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:2.4px;stroke-linejoin:round;pointer-events:none}
.sc .nt{color:var(--mute);font-size:12.5px;margin:10px 0 0}
.sc .nt b{color:var(--ink);font-weight:600}
.rk-h{display:flex;justify-content:space-between;color:var(--mute);font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;gap:8px}
.rk-ax{position:relative;height:14px;margin-left:34px;color:var(--mute);font:500 9.5px var(--mono)}
.rk-ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rk{display:grid;gap:1px}
.rk-row{display:grid;grid-template-columns:34px 1fr;align-items:center;height:14px;padding:0;border:0;background:none;cursor:pointer;color:var(--mute);font:500 9px var(--mono);text-align:left}
.rk-row .tk{position:relative;height:100%;display:block}
.rk-row .tk::before{content:"";position:absolute;left:var(--c);top:0;bottom:0;width:1px;background:var(--line)}
.rk-row .br{position:absolute;top:2px;bottom:2px;border-radius:2px;opacity:.55;transition:opacity .2s}
.rk-row.in .br{opacity:.9}
.rk-row[aria-current="true"]{color:var(--ink);font-weight:600}
.rk-row[aria-current="true"] .br{opacity:1;top:0;bottom:0}
.rk-row .vl{position:absolute;top:50%;transform:translateY(-50%);font:600 10px var(--mono);color:var(--ink);white-space:nowrap;background:var(--card);padding:0 3px;border-radius:3px}
.rk-row:hover .br{opacity:.9}
.rk-row:focus-visible{outline:2px solid var(--hi);outline-offset:0}
@media(min-width:820px){.rk-row{height:13px}}
.scp{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.scp button{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.04em;border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:0 11px;min-height:32px;cursor:pointer}
.scp button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.scp button:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.wv span{white-space:nowrap}
</style></head><body>
<div class="wrap">
<header><h1>Bulgaria: land vs people</h1><p class="sub">The 19 April 2026 parliamentary election by province. Tap one to resize it from its land area to its registered voters, or flip the whole map.</p></header>
<div class="controls">
 <div class="seg" id="seg" data-m="0" role="group" aria-label="Map view"><i></i><button id="bLand" aria-pressed="true">Land area</button><button id="bPop" aria-pressed="false">Electorate</button></div>
 <div class="dd" id="dd" data-open="0">
  <button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddList"><span class="lbl">Region</span><span class="val" id="ddVal">All regions</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg></button>
  <div class="dd-panel"><div class="dd-top"><input id="ddQ" type="search" placeholder="Search regions" autocomplete="off" aria-label="Search regions"><div class="sorts" id="sorts"><button data-s="n" aria-pressed="true">A–Z</button><button data-s="a" aria-pressed="false">Land</button><button data-s="p" aria-pressed="false">Voters</button></div></div>
  <ul class="dd-list" id="ddList" role="listbox" aria-label="Regions"></ul></div>
 </div>
</div>
<div class="nat" id="nat"></div>
<div class="grid">
 <div class="lc">
 <div class="mapbox" id="mapbox"><svg id="map" role="img" aria-label="Map of Bulgaria's electoral districts; tap a province to resize it by its registered voters"></svg><div class="capbar"><div class="cap" id="cap"></div><div class="togs"><select class="tog" id="colorBy" aria-label="Colour map by"></select><button class="tog" id="tLab" aria-pressed="true">Labels</button><button class="tog" id="tEdit" aria-pressed="false">Rearrange</button><button class="tog" id="tUndo" hidden>Undo</button><button class="tog" id="tReset" hidden>Reset</button><button class="tog" id="tRevert" hidden>Revert all</button></div></div><div class="leg" id="leg"></div></div>
 <section class="charts" id="charts" aria-label="Charts">
  <div class="cc" id="cWho"></div>
  <div class="cc sc" id="cSc"></div>
  <div class="cc" id="cRk"></div>
 </section>
 </div>
 <aside id="sheet" aria-live="polite" aria-label="Region details"><div id="pnBody"></div></aside>
</div>
<p class="note" id="note"></p>
</div>
<script>

function scScales(){const xmin=d3.min(LAND,lx),xmax=d3.max(LAND,lx),ymin=d3.min(LAND,shr),ymax=d3.max(LAND,shr);
 xD=[Math.floor((xmin-.12)*4)/4,Math.ceil((xmax+.12)*4)/4];const stp=(ymax-ymin)<30?5:10;yD=[Math.max(0,Math.floor((ymin-2)/stp)*stp),Math.min(100,Math.ceil((ymax+2)/stp)*stp)];yD.step=stp;
 sxs=d3.scaleLinear().domain(xD).range([SCl,SCW-SCr]);sys=d3.scaleLinear().domain(yD).range([SCH-SCb,SCt]);
 const w=LAND.map(s=>s.a.sumP),x=LAND.map(lx),y=LAND.map(shr),W=d3.sum(w),mx=d3.sum(x.map((v,i)=>v*w[i]))/W,my=d3.sum(y.map((v,i)=>v*w[i]))/W;
 const sxx=d3.sum(x.map((v,i)=>w[i]*(v-mx)**2)),syy=d3.sum(y.map((v,i)=>w[i]*(v-my)**2)),sxy=d3.sum(x.map((v,i)=>w[i]*(v-mx)*(y[i]-my)));fit={b:sxy/sxx,a:my-sxy/sxx*mx,r:sxy/Math.sqrt(sxx*syy)}}
function labelSet(){const forced=new Set([...(cur&&!ST[cur].abroad?[cur]:[]),...[...mor].filter(k=>!ST[k].abroad)]);
 const pri=[...forced,'SOF',...LAND.slice().sort((a,b)=>b.el-a.el).map(s=>s.code)];
 const seen=new Set(),order=pri.filter(k=>!seen.has(k)&&seen.add(k)),placed=[],out=[];
 const dots=LAND.map(s=>({x:sxs(lx(s)),y:sys(shr(s)),r:sr(s)+1,k:s.code}));
 const hit=(a,b)=>!(a.x1<b.x0||a.x0>b.x1||a.y1<b.y0||a.y0>b.y1);
 for(const k of order){if(out.length>=16&&!forced.has(k))break;const s=ST[k],cx=sxs(lx(s)),cy=sys(shr(s)),r=sr(s),w=k.length*6.3+3;
  const opts=[[cx+r+2,cy+3.4,'start'],[cx-r-2,cy+3.4,'end'],[cx,cy-r-3,'middle'],[cx,cy+r+10,'middle']];
  for(const [x,y,an] of opts){const x0=an==='start'?x:an==='end'?x-w:x-w/2,bb={x0,x1:x0+w,y0:y-8.5,y1:y+2};
   if(bb.x0<SCl-4||bb.x1>SCW-1||bb.y0<0||bb.y1>SCH-SCb+2)continue;
   if(placed.some(q=>hit(q,bb)))continue;
   if(!forced.has(k)&&dots.some(d=>d.k!==k&&bb.x0<d.x+d.r&&bb.x1>d.x-d.r&&bb.y0<d.y+d.r&&bb.y1>d.y-d.r))continue;
   placed.push(bb);out.push({k,x,y,an});break}}
 return out}
function drawScSkeleton(){const el=document.getElementById('cSc');scScales();
 const xt=[1,10,100,1000].filter(v=>Math.log10(v)>=xD[0]&&Math.log10(v)<=xD[1]),yt=d3.range(yD[0],yD[1]+.01,yD.step);
 const g=xt.map(v=>`<line class="gl" x1="${sxs(Math.log10(v))}" x2="${sxs(Math.log10(v))}" y1="${SCt}" y2="${SCH-SCb}"/><text class="tk" x="${sxs(Math.log10(v))}" y="${SCH-SCb+13}" text-anchor="middle">${v>=1000?'1k':v}</text>`).join('')+
  yt.map(v=>`<line class="gl" x1="${SCl}" x2="${SCW-SCr}" y1="${sys(v)}" y2="${sys(v)}"/><text class="tk" x="${SCl-5}" y="${sys(v)+3}" text-anchor="end">${v}</text>`).join('');
 const xa=xD[0]+.04,xb=xD[1]-.04,fa=fit.a+fit.b*xa,fb=fit.a+fit.b*xb;
 const ord=LAND.slice().sort((a,b)=>b.el-a.el);
 const dots=ord.map(s=>`<circle class="dt" data-k="${s.code}" cx="${sxs(lx(s)).toFixed(1)}" cy="${sys(shr(s)).toFixed(1)}" r="${sr(s).toFixed(1)}" style="fill:var(${PK[s.win].v})"><title>${escH(s.name)}: ${shr(s).toFixed(1)}% ${PK[scP].s}, ${fmt(Math.round(s.el/s.area))} registered voters per km²</title></circle>`).join('');
 const hits=ord.map(s=>`<circle class="hit" data-k="${s.code}" cx="${sxs(lx(s)).toFixed(1)}" cy="${sys(shr(s)).toFixed(1)}" r="${Math.max(sr(s),7).toFixed(1)}"/>`).join('');
 const rtxt=Math.abs(fit.r)<.2?`Density says little about ${PK[scP].s} support`:fit.r>0?`Denser districts give <b>${PK[scP].s}</b> more of the vote`:`Denser districts give <b>${PK[scP].s}</b> less of the vote`;
 el.innerHTML=`<h3>Density vs the vote</h3><p class="cs">Each dot is a province or city, coloured by its winner. Size is registered voters. Pick a party for the vertical axis.</p>
 <div class="scp" role="group" aria-label="Party on the vertical axis">${RACE.map(k=>`<button data-p="${k}" aria-pressed="${k===scP}"><i class="dot" style="background:var(${PK[k].v})"></i>${PK[k].s}</button>`).join('')}</div>
 <svg viewBox="0 0 ${SCW} ${SCH}" role="img" aria-label="Scatter of registered voters per square kilometre against ${PK[scP].n} share of the vote, by district">${g}
 <line class="fit" x1="${sxs(xa)}" y1="${sys(fa)}" x2="${sxs(xb)}" y2="${sys(fb)}"/>${dots}<g id="scLb"></g>${hits}
 <text class="ax" x="${(SCl+SCW-SCr)/2}" y="${SCH-4}" text-anchor="middle">Voters per km² · log scale</text>
 <text class="ax" transform="translate(9 ${(SCt+SCH-SCb)/2}) rotate(-90)" text-anchor="middle">${PK[scP].s} % of votes</text></svg>
 <p class="nt">${rtxt} (<b>r = ${fit.r>=0?'':'−'}${Math.abs(fit.r).toFixed(2)}</b>, weighted by votes; line shows the fit). This compares districts, not individual voters.</p>`;
 const svgS=el.querySelector('svg');
 svgS.addEventListener('click',e=>{const h=e.target.closest('[data-k]');if(h)setFocus(h.dataset.k)});
 svgS.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const h=e.target.closest('[data-k]');if(h)peekSet(h.dataset.k)});
 svgS.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&e.target.closest('[data-k]'))peekSet(null)});

 el.querySelectorAll('.dt').forEach(c=>{const k=c.dataset.k;c.classList.toggle('on',k===cur);c.classList.toggle('in',mor.has(k)&&k!==cur)});

const RK=LAND.slice().sort((a,b)=>b.pPct/b.aPct-a.pPct/a.aPct);
const rkLg=RK.map(s=>Math.log2(s.pPct/s.aPct)),rkLO=Math.floor(d3.min(rkLg)-.6),rkHI=Math.ceil(d3.max(rkLg)+.6),rkSP=rkHI-rkLO,rkCP=-rkLO/rkSP*100,rkPos=v=>(Math.log2(v)-rkLO)/rkSP*100;
function drawRkSkeleton(){const el=document.getElementById('cRk');

 el.innerHTML=`<h3>All 28, ranked</h3><p class="cs">A province's share of registered voters divided by its share of land. Bars right of the line gain size when resized; bars left shrink.</p>
 <div class="rk-h"><span>◀ shrinks</span><span>grows ▶</span></div><div class="rk-ax" id="rkAx">${tk.map(([v,l])=>`<span style="left:${rkPos(v)}%">${l}</span>`).join('')}</div>
 <div class="rk" id="rk" style="--c:${rkCP}%">${RK.map(s=>{const r=s.pPct/s.aPct,lg=Math.log2(r),w=Math.abs(lg)/rkSP*100,l=lg>=0?rkCP:rkCP-w;
  return `<button class="rk-row" data-k="${s.code}" aria-label="${escH(s.name)}, ${rkTxt(r)} when resized to its voters"><span>${s.code}</span><span class="tk" style="--c:${rkCP}%"><i class="br" style="left:${l}%;width:${Math.max(w,.5)}%;background:var(${PK[s.win].v})"></i><span class="vl"></span></span></button>`}).join('')}</div>`;
